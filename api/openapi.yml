openapi: 3.0.3

info:
  title: LinkForge API
  description: |
    LinkForge is an open source URL shortener built from Go microservices. This is its public HTTP API,
    served by the Gateway. Everything the dashboard does, you can do from a script.

    ## Quick start

    1. Sign in to the dashboard and create an API key under **API keys**.
    2. Send the key in the `X-API-Key` header.

    ```bash
    curl -X POST https://linkforge.deaprima.my.id/api/v1/links \
      -H "X-API-Key: lf_sk_a3f9b2c1d4e5..." \
      -H "Content-Type: application/json" \
      -d '{"original_url": "https://example.com/a/very/long/url", "alias": "pitch"}'
    ```

    ## Authentication

    | Method | Use it for | How |
    |---|---|---|
    | **API key** | Scripts, CLIs, CI | `X-API-Key: lf_sk_...` header. Works on link and analytics endpoints. Does not expire; revoke it from the dashboard. |
    | **Bearer token** | Apps acting for a signed-in user | `Authorization: Bearer <access_token>` from `/auth/login`. Access tokens last 15 minutes; renew with `/auth/refresh`. |
    | **Session cookie** | The LinkForge web app | HttpOnly `access_token` / `refresh_token` cookies set on sign-in. Browsers only. |

    Account management endpoints (`/auth/me`, `/auth/api-keys`, `/auth/logout`) accept a bearer token or session
    cookie only. API keys are for links and analytics, not for managing the account.

    ## Response format

    Every response from `/api/v1` uses the same envelope.

    ```json
    { "success": true, "data": { }, "meta": { "page": 1, "limit": 20, "total": 100 } }
    ```

    ```json
    { "success": false, "error": { "code": "LINK_NOT_FOUND", "message": "The requested short link does not exist." } }
    ```

    `meta` appears only on paginated lists. Branch on `error.code`, which is stable; `error.message` is for humans.

    ## Rate limits

    Every endpoint except `/healthz` and `/readyz` is rate limited. Public endpoints (auth, redirect) are limited per IP; authenticated endpoints are limited per user, shared across the Bearer token and all of the user's API keys. Defaults: auth 20 per 15 minutes per IP, redirect 300 per minute per IP, authenticated API 120 per minute per user. Password verification and password reset have stricter limits, described on each endpoint.

    Rate limited endpoints send these headers on every response, including `429`:

    | Header | Meaning |
    |---|---|
    | `X-RateLimit-Limit` | Requests allowed in the window |
    | `X-RateLimit-Remaining` | Requests left in the window |
    | `X-RateLimit-Reset` | Unix time (seconds) when the window resets |
    | `Retry-After` | Seconds to wait; only on `429` |

    ## Error codes

    | Code | HTTP | Meaning |
    |---|---|---|
    | `VALIDATION_ERROR` | 400 | The request body or a parameter is invalid |
    | `MALICIOUS_URL` | 400 | The destination domain is on the blocklist |
    | `INVALID_RESET_TOKEN` | 400 | A password reset link is invalid, expired or already used |
    | `UNAUTHORIZED` | 401 | Missing or invalid credentials |
    | `FORBIDDEN` | 403 | The resource belongs to someone else |
    | `LINK_NOT_FOUND` | 404 | No such link or alias |
    | `EMAIL_ALREADY_EXISTS` | 409 | The email is already registered |
    | `ALIAS_ALREADY_TAKEN` | 409 | The alias is in use |
    | `LINK_EXPIRED` | 410 | The link passed its expiry date |
    | `RATE_LIMIT_EXCEEDED` | 429 | Too many requests |
    | `SERVICE_UNAVAILABLE` | 503 | A backend service is down or its circuit breaker is open |
    | `INTERNAL_ERROR` | 500 | Unexpected error |
  version: 1.0.0
  license:
    name: MIT
    url: https://github.com/deaprima/linkforge/blob/main/LICENSE
  contact:
    name: Dea Prima
    url: https://github.com/deaprima/linkforge

servers:
  - url: https://linkforge.deaprima.my.id/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: LINK_NOT_FOUND
            message:
              type: string
              example: The requested short link does not exist.

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 7b0f4a1e-5c1a-4d6e-9a5a-0c5d3f9b2e11
        name:
          type: string
          example: Dea Prima
        email:
          type: string
          format: email
          example: dea@example.com
        created_at:
          type: string
          format: date-time
          example: "2026-07-08T07:00:00Z"

    Link:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f2b8c1a-9d4e-4b7a-8c11-5e6f7a8b9c0d
        original_url:
          type: string
          format: uri
          example: https://example.com/a/very/long/url
        alias:
          type: string
          example: pitch
        short_url:
          type: string
          format: uri
          example: https://linkforge.deaprima.my.id/pitch
        click_count:
          type: integer
          example: 254
        has_password:
          type: boolean
          example: false
        expired_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-31T23:59:59Z"
        created_at:
          type: string
          format: date-time
          example: "2026-07-08T07:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-07-08T07:00:00Z"

    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
        name:
          type: string
          example: CI pipeline
        key_prefix:
          type: string
          description: First characters of the key, so you can recognise it. The full key is never shown again.
          example: lf_sk_a3f9b2
        last_used_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-10T09:30:00Z"
        created_at:
          type: string
          format: date-time
          example: "2026-07-08T07:00:00Z"

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: 4f8a1c...

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            access_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refresh_token:
              type: string
              example: 4f8a1c...

    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/TokenPair'

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: If that email is registered, a reset link is on its way.

    ApiKeyListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'

    CreatedApiKeyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
            name:
              type: string
              example: CI pipeline
            key:
              type: string
              description: The full key. Shown once; store it now.
              example: lf_sk_a3f9b2c1d4e5f60718293a4b5c6d7e8f
            created_at:
              type: string
              format: date-time
              example: "2026-07-08T07:00:00Z"

    LinkResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Link'

    LinkListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AnalyticsSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            total_links:
              type: integer
              example: 42
            total_clicks:
              type: integer
              example: 1280
            top_links:
              type: array
              items:
                type: object
                properties:
                  link_id:
                    type: string
                    format: uuid
                    example: 3f2b8c1a-9d4e-4b7a-8c11-5e6f7a8b9c0d
                  alias:
                    type: string
                    example: pitch
                  clicks:
                    type: integer
                    example: 254

    LinkAnalyticsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            link_id:
              type: string
              format: uuid
              example: 3f2b8c1a-9d4e-4b7a-8c11-5e6f7a8b9c0d
            total_clicks:
              type: integer
              example: 254
            unique_clicks:
              type: integer
              example: 180
            top_countries:
              type: array
              items:
                type: object
                properties:
                  country:
                    type: string
                    description: ISO 3166-1 alpha-2 code, or `ZZ` when unknown.
                    example: ID
                  count:
                    type: integer
                    example: 120
            top_browsers:
              type: array
              items:
                type: object
                properties:
                  browser:
                    type: string
                    example: Chrome
                  count:
                    type: integer
                    example: 200
            top_devices:
              type: array
              items:
                type: object
                properties:
                  device:
                    type: string
                    enum: [mobile, desktop, tablet, bot]
                    example: mobile
                  count:
                    type: integer
                    example: 180
            time_series:
              type: array
              description: One entry per day in the range, including days with no clicks.
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                    example: "2026-07-01"
                  clicks:
                    type: integer
                    example: 30

    RedirectUrlResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            redirect_url:
              type: string
              format: uri
              example: https://example.com/a/very/long/url

  responses:
    ValidationError:
      description: The request is invalid. `error.message` says which field and why.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: password must be at least 8 characters

    Unauthorized:
      description: Credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Missing or invalid authentication token.

    Forbidden:
      description: The resource belongs to another account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have access to this resource.

    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: LINK_NOT_FOUND
              message: The requested short link does not exist.

    RateLimitExceeded:
      description: Too many requests. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until the window resets.
          schema:
            type: integer
            example: 600
        X-RateLimit-Limit:
          schema:
            type: integer
            example: 5
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1720400000
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Too many requests. Please slow down.

    ServiceUnavailable:
      description: A backend service is unavailable (its circuit breaker is open). Retry shortly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: SERVICE_UNAVAILABLE
              message: Service is temporarily unavailable, please try again later.

paths:

  # Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: |
        Registers an account with email and password and signs the user in. Emails are case-insensitive.
        Browsers also receive session cookies; send `X-Session-Mode: cookie` to keep tokens out of the body.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Dea Prima
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: dea@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  example: correct-horse-battery
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: This email is already registered.

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: dea@example.com
                password:
                  type: string
                  example: correct-horse-battery
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: invalid credentials

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: |
        Emails a single-use reset link that is valid for one hour. The response is always the same whether or not
        the email is registered, so this endpoint cannot be used to find out who has an account.

        Requesting again invalidates earlier links. Accounts created with Google can use this to set a password.

        Rate limited per IP; the limit headers are sent on every response.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: dea@example.com
      responses:
        '200':
          description: Accepted. If the email is registered, a link has been sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      description: |
        Completes a reset started by `/auth/forgot-password`. The `token` is the value in the emailed link
        (`/app/reset-password?token=...`). A token works once.

        On success every existing session is revoked, so the user must sign in again with the new password.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  example: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f9a0b1c2d3e4f5061728394a5b6c7d8e
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  example: a-new-strong-password
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: Your password has been changed. Sign in with the new password.
        '400':
          description: The token is invalid, expired or already used, or the password is too short.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  summary: Bad token
                  value:
                    success: false
                    error:
                      code: INVALID_RESET_TOKEN
                      message: This reset link is invalid or has expired.
                validation:
                  summary: Bad password
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: password must be at least 8 characters
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Get a new access token
      description: |
        Exchanges a refresh token for a new pair. The old refresh token is revoked (rotation). Reusing a revoked
        token revokes every session of that account.

        Browsers can omit the body: the refresh cookie is used and the response is `204`.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: 4f8a1c...
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      description: Revokes the given refresh token.
      operationId: logoutUser
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: 4f8a1c...
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the signed-in user
      operationId: getMe
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: The user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/oauth/google:
    get:
      tags: [Auth - OAuth]
      summary: Start Google sign-in
      description: Redirects the browser to Google's consent screen. No body. Available only when Google OAuth is configured.
      operationId: oauthGoogle
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '302':
          description: Redirect to Google.

  /auth/oauth/google/callback:
    get:
      tags: [Auth - OAuth]
      summary: Google redirects here after consent
      operationId: oauthGoogleCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '302':
          description: |
            Redirects to `{FRONTEND_URL}/app/dashboard`, or to `/app/login?error=<reason>` on failure.
            Session cookies are set:
            - `access_token`: HttpOnly; Secure; SameSite=Lax; Path=/
            - `refresh_token`: HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "access_token=eyJ...; HttpOnly; Secure; SameSite=Lax; Path=/"
        '400':
          description: The callback is invalid.

  /auth/api-keys:
    post:
      tags: [Auth - API Keys]
      summary: Create an API key
      description: The full key is returned once, in this response. LinkForge stores only a hash.
      operationId: createApiKey
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Where you will use it, so you know which key to revoke later.
                  example: CI pipeline
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '201':
          description: Key created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiKeyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [Auth - API Keys]
      summary: List your API keys
      operationId: listApiKeys
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: Your keys, without the secret part.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/api-keys/{id}:
    delete:
      tags: [Auth - API Keys]
      summary: Revoke an API key
      description: The key stops working immediately. Your other keys are not affected.
      operationId: deleteApiKey
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '204':
          description: Key revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # Links
  /links:
    post:
      tags: [Links]
      summary: Create a short link
      operationId: createLink
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [original_url]
              properties:
                original_url:
                  type: string
                  format: uri
                  description: Must start with `http://` or `https://`.
                  example: https://example.com/a/very/long/url
                alias:
                  type: string
                  description: "Optional. 3 to 64 characters: letters, numbers, `-` and `_`. Generated when omitted."
                  example: pitch
                expired_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Optional. The link stops working after this time.
                  example: "2026-12-31T23:59:59Z"
                password:
                  type: string
                  minLength: 4
                  maxLength: 72
                  description: Optional. Visitors must enter it before they are redirected.
                  example: secret123
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          description: The request is invalid, or the destination domain is blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Invalid field
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: original_url must be a valid http(s) URL
                malicious:
                  summary: Blocked domain
                  value:
                    success: false
                    error:
                      code: MALICIOUS_URL
                      message: This URL has been flagged as potentially harmful.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The alias is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: ALIAS_ALREADY_TAKEN
                  message: This alias is already in use.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [Links]
      summary: List your links
      description: Newest first.
      operationId: listLinks
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: A page of links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /links/{id}:
    get:
      tags: [Links]
      summary: Get a link
      operationId: getLink
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: The link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Links]
      summary: Update a link
      description: |
        Replaces the link's settings. Omitting `expired_at` removes the expiry. The password cannot be changed here.
      operationId: updateLink
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                original_url:
                  type: string
                  format: uri
                  example: https://example.com/a/new/destination
                alias:
                  type: string
                  example: pitch
                expired_at:
                  type: string
                  format: date-time
                  nullable: true
                  example: "2026-12-31T23:59:59Z"
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: Link updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The new alias is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: ALIAS_ALREADY_TAKEN
                  message: This alias is already in use.

    delete:
      tags: [Links]
      summary: Delete a link
      description: The short link stops working immediately and its alias becomes available again.
      operationId: deleteLink
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '204':
          description: Link deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /links/{id}/qr:
    get:
      tags: [Links]
      summary: Get a QR code for a link
      operationId: getLinkQr
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          description: Width and height in pixels.
          schema:
            type: integer
            default: 256
            minimum: 64
            maximum: 1024
        - name: format
          in: query
          schema:
            type: string
            enum: [png, svg]
            default: png
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: The QR code image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '400':
          description: "`size` is outside 64 to 1024, or `format` is not `png` or `svg`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Analytics
  /analytics/summary:
    get:
      tags: [Analytics]
      summary: Get totals across your account
      operationId: getAnalyticsSummary
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: Totals and your top links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /analytics/links/{id}:
    get:
      tags: [Analytics]
      summary: Get click statistics for a link
      description: Defaults to the last 30 days. The range can span at most 366 days.
      operationId: getLinkAnalytics
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: First day, inclusive (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
            example: "2026-07-01"
        - name: to
          in: query
          description: Last day, inclusive (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
            example: "2026-07-31"
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '200':
          description: Click statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAnalyticsResponse'
        '400':
          description: A date is malformed, `from` is after `to`, or the range is longer than 366 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /analytics/realtime:
    get:
      tags: [Analytics]
      summary: Stream clicks as they happen (WebSocket)
      description: |
        Upgrades to a WebSocket that sends one JSON event per click on your links. Authenticate with a bearer
        token in the `token` query parameter, the `access_token` cookie, or an `Authorization` header. API keys
        do not work here. Browser origins must be listed in `CORS_ALLOWED_ORIGINS`. The server pings every 30 seconds.
      operationId: getRealtimeAnalytics
      parameters:
        - name: token
          in: query
          description: Access token (JWT). Redacted from Gateway access logs.
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '101':
          description: Switching to WebSocket.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The origin is not allowed.

  # Redirects (served at the root, outside /api/v1)
  /{alias}:
    get:
      tags: [Redirect]
      servers:
        - url: https://linkforge.deaprima.my.id
          description: Production
        - url: http://localhost:8080
          description: Local development
      summary: Open a short link
      description: |
        Redirects (302) to the destination. Public, no authentication.

        When the request comes from a browser (`Accept: text/html`), anything other than a redirect becomes a 302
        to the web app instead: password protected → `/app/p/{alias}`, missing → `/app/not-found?alias=`,
        expired → `/app/expired?alias=`, backend down → `/app/unavailable?alias=`.
      operationId: resolveRedirect
      parameters:
        - name: alias
          in: path
          required: true
          schema:
            type: string
            example: pitch
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '302':
          description: Redirect to the destination.
          headers:
            Location:
              schema:
                type: string
                example: https://example.com/a/very/long/url
        '200':
          description: The link is password protected. Call `POST /{alias}/verify`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: PASSWORD_REQUIRED
                  message: This link is password protected.
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The link has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: LINK_EXPIRED
                  message: This link has expired.

  /{alias}/verify:
    post:
      tags: [Redirect]
      servers:
        - url: https://linkforge.deaprima.my.id
          description: Production
        - url: http://localhost:8080
          description: Local development
      summary: Unlock a password protected link
      description: |
        Checks the password and returns the destination. Brute-force protected: by default 5 attempts per
        15 minutes per IP and alias, and 20 per 15 minutes per IP. Rate limit headers are on every response.
        If the limiter is unavailable the request is refused (fail-closed).
      operationId: verifyLinkPassword
      parameters:
        - name: alias
          in: path
          required: true
          schema:
            type: string
            example: pitch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Correct password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectUrlResponse'
        '401':
          description: Wrong password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Invalid password.
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The link has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts. See `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Too many password attempts. Try again later.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # Operations
  /healthz:
    get:
      tags: [Operations]
      servers:
        - url: http://localhost:8080
          description: Local development
      summary: Liveness check
      description: Returns `200` while the Gateway process is up. Not wrapped in the response envelope.
      operationId: healthz
      responses:
        '200':
          description: The Gateway is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [Operations]
      servers:
        - url: http://localhost:8080
          description: Local development
      summary: Readiness check
      description: |
        Checks that Auth, Link, Analytics and Redis can be reached. `200` when all are healthy, `503` otherwise.
        Not wrapped in the response envelope.
      operationId: readyz
      responses:
        '200':
          description: Every dependency is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: At least one dependency is unavailable.

tags:
  - name: Auth
    description: Create accounts, sign in, reset passwords and manage sessions.
  - name: Auth - OAuth
    description: Sign in with Google.
  - name: Auth - API Keys
    description: Create and revoke API keys for scripts and CI.
  - name: Links
    description: Create, read, update and delete short links, and download QR codes.
  - name: Analytics
    description: Click statistics for a link or your whole account, and a live click stream.
  - name: Redirect
    description: The public short link itself, served from the root of the domain.
  - name: Operations
    description: Health checks for monitoring.
