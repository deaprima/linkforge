# Prometheus di docker-compose.prod.yml: service dijangkau lewat nama di jaringan internal Compose.
# Port ops (9100-9103) tidak dipublikasikan ke host, jadi hanya container di jaringan ini yang bisa scrape.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['gateway:9100']
  - job_name: auth
    static_configs:
      - targets: ['auth:9101']
  - job_name: link
    static_configs:
      - targets: ['link:9102']
  - job_name: analytics
    static_configs:
      - targets: ['analytics:9103']
