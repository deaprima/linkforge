version: '3.8'

services:

  # Postgres
  postgres:
    image: postgres:16-alpine
    container_name: linkforge-postgres
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql 
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # Kafka - KRaft mode
  kafka:
    image: bitnami/kafka:3.5
    container_name: linkforge-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092} # <-- Gunakan KAFKA_PORT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafkadata:/bitnami/kafka
    restart: unless-stopped
  
  # Swagger UI — API Documentation
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: linkforge-swagger
    ports:
      - "${SWAGGER_PORT}:8080"
    volumes:
      - ./api/openapi.yml:/tmp/openapi.yml   
    environment:
      SWAGGER_JSON: /tmp/openapi.yml     
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kafkadata:
