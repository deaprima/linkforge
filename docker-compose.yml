version: '3.8'

services:

  # Postgres
  postgres:
    image: postgres:16-alpine
    container_name: linkforge-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: password
      POSTGRES_DB: linkforge_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Kafka - KRaft mode
  kafka:
    image: bitnami/kafka:3.5
    container_name: linkforge-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafkadata:/bitnami/kafka
  
  # Swagger UI — API Documentation
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: linkforge-swagger
    ports:
      - "8090:8080"
    volumes:
      - ./api/openapi.yml:/tmp/openapi.yml   
    environment:
      SWAGGER_JSON: /tmp/openapi.yml     
    restart: unless-stopped


volumes:
  pgdata:
  redisdata:
  kafkadata:
