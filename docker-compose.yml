version: '3.8'

services:

  # Postgres
  postgres:
    image: postgres:16-alpine
    container_name: linkforge-postgres
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql 
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

    # Kafka - KRaft mode
  kafka:
    # Di-pin (jangan :latest) supaya upgrade major version Kafka selalu disengaja & diuji dulu
    # terhadap segmentio/kafka-go. Teruji: produce, consumer group, commit offset.
    image: apache/kafka:4.3.1
    container_name: linkforge-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      # KRaft mode settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      
      # Listeners (menggunakan dual listener: INTERNAL untuk komunikasi antar container, EXTERNAL untuk host)
      KAFKA_LISTENERS: 'INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Q' 
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    restart: unless-stopped

  
  # Swagger UI — API Documentation
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: linkforge-swagger
    ports:
      - "${SWAGGER_PORT}:8080"
    volumes:
      - ./api/openapi.yml:/tmp/openapi.yml   
    environment:
      SWAGGER_JSON: /tmp/openapi.yml     
    restart: unless-stopped

  # Prometheus — scrape /metrics tiap service (port ops internal, lihat monitoring/prometheus/prometheus.yml)
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: linkforge-prometheus
    ports:
      # Hanya loopback: UI Prometheus tidak boleh publik
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      # Service Go jalan di host; di Linux alias ini tidak otomatis ada seperti di Docker Desktop
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Grafana — datasource & dashboard di-provision dari monitoring/grafana
  grafana:
    image: grafana/grafana:11.3.1
    container_name: linkforge-grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Ganti sebelum dipakai di luar mesin lokal
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kafkadata:
  promdata:
  grafanadata:
