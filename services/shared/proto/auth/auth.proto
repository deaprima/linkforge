syntax = "proto3";

package auth;

option go_package = "github.com/deaprima/linkforge/services/shared/proto/auth";

import "google/protobuf/timestamp.proto";

// Messages

message User {
  string id         = 1;
  string name       = 2;
  string email      = 3;
  google.protobuf.Timestamp created_at = 4;
}

message TokenPair {
  string access_token  = 1;
  string refresh_token = 2;
}

message ApiKey {
  string id   = 1;
  string name = 2;
  google.protobuf.Timestamp last_used_at = 3;
  google.protobuf.Timestamp created_at   = 4;
  // 12 karakter pertama raw key (mis. "lf_sk_a3f9b2"), untuk ditampilkan di UI setelah key dibuat
  string key_prefix = 5;
}

// Auth RPC — Request & Response

message RegisterRequest {
  string name     = 1;
  string email    = 2;
  string password = 3;
}
message RegisterResponse {
  User      user  = 1;
  TokenPair tokens = 2;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}
message LoginResponse {
  User      user   = 1;
  TokenPair tokens = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}
message RefreshTokenResponse {
  TokenPair tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}
message LogoutResponse {
  bool success = 1;
}

// ValidateToken digunakan oleh Gateway untuk memverifikasi JWT
message ValidateTokenRequest {
  string access_token = 1;
}
message ValidateTokenResponse {
  bool   is_valid = 1;
  string user_id  = 2;
  string email    = 3;
}

message GetUserRequest {
  string user_id = 1;
}
message GetUserResponse {
  User user = 1;
}

// API Key RPC — Request & Response

message CreateApiKeyRequest {
  string user_id = 1;
  string name    = 2;
}
message CreateApiKeyResponse {
  ApiKey api_key = 1;
  // raw_key hanya dikembalikan sekali saat pembuatan
  string raw_key = 2;
}

message ListApiKeysRequest {
  string user_id = 1;
}
message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
}

message DeleteApiKeyRequest {
  string user_id    = 1;
  string api_key_id = 2;
}
message DeleteApiKeyResponse {
  bool success = 1;
}

message ValidateApiKeyRequest {
  string api_key = 1;
}
message ValidateApiKeyResponse {
  bool   is_valid = 1;
  string user_id  = 2;
}

// GoogleAuth — verifikasi Google ID Token dari client
message GoogleAuthRequest {
  string id_token = 1; // Google ID Token yang dikirim dari frontend/Gateway
}
message GoogleAuthResponse {
  User      user   = 1;
  TokenPair tokens = 2;
}

// Password reset — alur lupa password.
// RequestPasswordReset selalu sukses (juga untuk email yang tidak terdaftar) supaya tidak membocorkan siapa yang punya akun.
message RequestPasswordResetRequest {
  string email = 1;
}
message RequestPasswordResetResponse {
  bool success = 1;
}

// ResetPassword memakai token mentah dari email; token tidak valid/kedaluwarsa/terpakai = InvalidArgument.
message ResetPasswordRequest {
  string token        = 1;
  string new_password = 2;
}
message ResetPasswordResponse {
  bool success = 1;
}

// Service Definition

service AuthService {
  rpc Register(RegisterRequest)           returns (RegisterResponse);
  rpc Login(LoginRequest)                 returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest)   returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest)               returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser(GetUserRequest)             returns (GetUserResponse);

  rpc CreateApiKey(CreateApiKeyRequest)   returns (CreateApiKeyResponse);
  rpc ListApiKeys(ListApiKeysRequest)     returns (ListApiKeysResponse);
  rpc DeleteApiKey(DeleteApiKeyRequest)   returns (DeleteApiKeyResponse);
  rpc ValidateApiKey(ValidateApiKeyRequest) returns (ValidateApiKeyResponse);

  rpc GoogleAuth(GoogleAuthRequest) returns (GoogleAuthResponse);

  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest)               returns (ResetPasswordResponse);
}
